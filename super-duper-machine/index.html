<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Super Duper Machine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Notch:wght@200..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>

<!-- wobbles every line a little, so the drawings look hand-made -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5"/>
  </filter>
</svg>

<!-- Screen 1: the stack of boxes. Each box is a full-size PNG layer; its button sits on the box
     (--x/--y/--w/--h = the layer's drawn area as % of the 2388 x 3692 frame, which is cropped to
     the boxes). Layers are listed
     bottom to top, so a box drawn over another one also catches the clicks. -->
<!-- the title is the middle band of sdm-title-2.png, shown across the full width of both screens;
     on the machines screen it is the way back to the stack -->
<h1 id="title"><a href="#make" title="Make a machine"><img src="/media/sdm-title-2.png" alt="Super Duper Machine"></a></h1>

<section id="make-screen">
  <div class="cover-stage">
    <div class="cover-art" role="group" aria-label="Build a machine: tap a box to set it up">
      <div class="frame">
        <div class="layer" style="--x:11.2%;--y:63.9%;--w:83.2%;--h:30.9%">
          <img src="/media/sdm-customize-2.png" alt="">
          <button type="button" class="hit" data-box="customize" aria-label="Look: draw its body"></button>
        </div>
        <div class="layer" style="--x:43.3%;--y:35.2%;--w:46%;--h:30.7%">
          <img src="/media/sdm-sound-2.png" alt="">
          <button type="button" class="hit" data-box="sound" aria-label="Sound: what it does"></button>
        </div>
        <div class="layer" style="--x:15.7%;--y:36.7%;--w:52.7%;--h:33%">
          <img src="/media/sdm-type-2.png" alt="">
          <button type="button" class="hit" data-box="type" aria-label="Words: what it says"></button>
        </div>
        <div class="layer" style="--x:29.6%;--y:10.1%;--w:35.1%;--h:33.5%">
          <img src="/media/sdm-motion-2.png" alt="">
          <button type="button" class="hit" data-box="motion" aria-label="Motion: what it senses"></button>
        </div>
      </div>
    </div>
  </div>

  <form id="make-bar">
    <p id="make-hint" role="status"></p>
    <div class="row">
      <input id="make-name" maxlength="24" placeholder="Name it" aria-label="Machine name" autocomplete="off">
      <button id="make-go" type="submit" class="primary" disabled>Make it</button>
      <button id="see-machines" type="button">Lab</button>
    </div>
  </form>
</section>

<!-- Screen 2: every machine as a drawing; tap one to see what it is and to play it -->
<section id="grid-screen" hidden>
  <ul id="grid"></ul>
</section>

<!-- what a tapped machine is, and where you play it -->
<dialog id="dlg-machine">
  <div class="m-stage">
    <div id="m-body" class="body" role="img"><div id="m-art"></div></div>
    <div id="m-bubble" class="bubble" hidden></div>
  </div>
  <h2 id="m-name"></h2>
  <p id="m-detail"><small></small></p>
  <p id="m-status" role="status"></p>
  <output id="m-reading" hidden></output>
  <div class="row">
    <button id="m-start" type="button">Start</button>
    <button id="m-sim" type="button">Simulate</button>
  </div>
  <details id="m-setup">
    <summary>See set-up</summary>
    <dl id="m-setup-list"></dl>
  </details>
  <menu>
    <button id="m-delete" type="button">Delete</button>
    <button id="m-share" type="button" disabled>Share</button>
    <button id="m-close" type="button" class="primary">Close</button>
  </menu>
</dialog>

<!-- someone sent you a machine -->
<dialog id="dlg-import">
  <div class="m-stage"><div id="i-body" class="body" role="img"></div></div>
  <h2 id="i-name"></h2>
  <p id="i-detail"><small></small></p>
  <p id="i-note"></p>
  <menu>
    <button id="i-no" type="button">No thanks</button>
    <button id="i-yes" type="button" class="primary">Add to my lab</button>
  </menu>
</dialog>

<!-- one small editor per box -->
<dialog id="dlg-motion">
  <form method="dialog">
    <h2>Motion</h2>
    <p>What should your machine sense?</p>
    <div id="sensor-options" class="options"></div>
    <menu><button class="primary">Done</button></menu>
  </form>
</dialog>

<dialog id="dlg-sound">
  <form method="dialog">
    <h2>Sound</h2>
    <p>What should it do when it feels that?</p>
    <div id="action-options" class="options"></div>
    <div id="recorder" hidden>
      <p id="rec-status" role="status"><small></small></p>
      <div class="row">
        <button id="rec-go" type="button">Record</button>
        <button id="rec-play" type="button" hidden>Play</button>
      </div>
    </div>
    <menu><button class="primary">Done</button></menu>
  </form>
</dialog>

<dialog id="dlg-type">
  <form method="dialog">
    <h2>Words</h2>
    <label>What does it say? <input id="e-text" maxlength="30" placeholder="Hello!"></label>
    <label>Then open <select id="e-open"></select></label>
    <label id="e-url-row" hidden>Link <input id="e-url" type="text" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="example.com or tel:+31…"></label>
    <p id="e-url-hint" role="status"><small></small></p>
    <p><small>A phone may ask you to tap before an app opens.</small></p>
    <menu><button class="primary">Done</button></menu>
  </form>
</dialog>

<dialog id="dlg-param">
  <form method="dialog">
    <h2>Tune it</h2>
    <p id="tune-intro"></p>
    <div id="tune-rows"></div>
    <menu>
      <button id="tune-reset" type="button">Reset</button>
      <button class="primary">Done</button>
    </menu>
  </form>
</dialog>

<dialog id="dlg-customize">
  <form method="dialog">
    <h2>Look</h2>
    <p>Draw its body <small>(optional)</small></p>
    <canvas id="pad" width="280" height="280"></canvas>
    <p><button id="e-clear" type="button">Clear</button></p>
    <menu><button class="primary">Done</button></menu>
  </form>
</dialog>

<script type="module" src="/src/main.js"></script>
</body>
</html>
